name: 功能建议
description: 建议新功能或改进
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 问题或使用场景
      description: 这个功能解决什么问题？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议的方案
      description: 你希望它怎么工作？
    validations:
      required: true
