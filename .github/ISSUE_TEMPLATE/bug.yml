name: Bug 报告
description: 报告问题或意外行为
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清楚描述遇到的问题。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 复现问题的步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 你期望发生什么。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: "操作系统、工具版本等。"
    validations:
      required: false
